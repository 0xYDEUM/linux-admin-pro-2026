<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Приветствие</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            text-align: center;
            padding: 40px 60px;
            border-radius: 12px;
            background: #b8b8b8;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h1 { color: #000000; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет, OTUS!</h1>
    </div>
</body>    
</html>
